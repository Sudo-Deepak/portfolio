name = "portfolio"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# Nightly maintenance: roll up daily totals + prune raw events older than 180 days
# (see the `scheduled` handler in src/index.ts). Keeps D1 usage inside the free tier.
[triggers]
crons = ["0 3 * * *"]  # 03:00 UTC daily

# Non-secret config. RESUME_FILENAME is the ONE place the generalized download
# name lives — change it here to rename the resume everyone downloads.
[vars]
RESUME_FILENAME = "Deepak_Kumar_Senior_Java_Developer.pdf"
RESUME_OBJECT_KEY = "resume.pdf"
ALLOWED_ORIGIN = "https://sudo-deepak.github.io"
SESSION_TTL_SECONDS = "28800"
# Contact-form lead notifications (sent via Resend). The lead is always stored in
# D1 regardless; email is best-effort. LEAD_FROM_EMAIL can stay as Resend's shared
# sender until a custom domain is verified.
LEAD_NOTIFY_EMAIL = "deepakprajapati.work@gmail.com"
LEAD_FROM_EMAIL = "onboarding@resend.dev"

# Analytics (SQLite). Fill database_id after `wrangler d1 create portfolio_analytics`.
[[d1_databases]]
binding = "DB"
database_name = "portfolio_analytics"
database_id = "4d8979f8-192d-4b46-8ea2-82760d9b4f04"

# The resume PDF is stored as a BLOB in D1 (table `assets`), so no R2 bucket is needed.

# Admin login sessions. Fill id after `wrangler kv namespace create SESSIONS`.
[[kv_namespaces]]
binding = "SESSIONS"
id = "4b3aeceb990d4dbe9b62e43224d09cba"

# Secrets (set via `wrangler secret put`, NEVER committed):
#   ADMIN_USERNAME, ADMIN_PASSWORD_HASH, SESSION_SECRET
#   RESEND_API_KEY   -- Resend API key for contact-form lead emails (optional; leads
#                       are still captured in D1 + the admin dashboard without it)
